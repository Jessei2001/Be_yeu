<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Một chút nghỉ ngơi</title>
  <style>
    :root{
      --bg1:#efb6d2;
      --bg2:#e7dcf5;
      --card:#fff7fb;
      --ink:#694459;
      --muted:#795b71;
      --accent:#ffd1e1;
      --accent2:#fff1a8;
      --accent3:#c5f1ff;
      --btn:#a94e7e;
      --btn2:#c778a0;
      --shadow:0 18px 40px rgba(128,65,104,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family: "Segoe UI", system-ui, -apple-system, sans-serif;color:var(--ink);overflow-x:hidden}
    body{
      background: linear-gradient(180deg,var(--bg1) 0%, #f3cadd 35%, var(--bg2) 100%);
      min-height:100vh;
      position:relative;
    }
    .sky-glow{
      position:fixed; inset:auto auto -18vmax -15vmax; width:45vmax; height:45vmax; border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.42), rgba(255,255,255,0) 64%); pointer-events:none;
      filter:blur(8px);
    }
    .stars{position:fixed; inset:0; pointer-events:none; overflow:hidden;}
    .star{position:absolute; top:-20px; color:#fffce8; opacity:.75; text-shadow:0 0 12px rgba(255,255,255,.7); animation:fall linear infinite; user-select:none;}
    @keyframes fall{0%{transform:translateY(-20px) rotate(0deg); opacity:0} 8%{opacity:.8} 92%{opacity:.75} 100%{transform:translateY(110vh) rotate(180deg); opacity:0}}

    .cloud{position:fixed; background:rgba(255,255,255,.9); border-radius:999px; filter:drop-shadow(0 10px 18px rgba(255,255,255,.18)); opacity:.9}
    .cloud::before,.cloud::after{content:""; position:absolute; background:inherit; border-radius:50%}
    .cloud.c1{width:140px;height:42px;top:12vh;left:-170px;animation:drift 34s linear infinite}
    .cloud.c1::before{width:56px;height:56px;left:18px;top:-24px}
    .cloud.c1::after{width:68px;height:68px;right:18px;top:-30px}
    .cloud.c2{width:110px;height:34px;top:28vh;right:-130px;animation:drift2 40s linear infinite}
    .cloud.c2::before{width:46px;height:46px;left:14px;top:-19px}
    .cloud.c2::after{width:52px;height:52px;right:15px;top:-20px}
    .cloud.c3{width:160px;height:48px;top:67vh;left:-180px;animation:drift 42s linear infinite; animation-delay:-12s}
    .cloud.c3::before{width:64px;height:64px;left:18px;top:-24px}
    .cloud.c3::after{width:74px;height:74px;right:20px;top:-28px}
    @keyframes drift{from{transform:translateX(0)} to{transform:translateX(calc(100vw + 360px))}}
    @keyframes drift2{from{transform:translateX(0)} to{transform:translateX(calc(-100vw - 300px))}}

    .wrap{
      position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:22px;
    }
    .card{
      width:min(92vw, 430px); background:rgba(255,247,251,.92); backdrop-filter: blur(8px);
      border:1px solid rgba(255,255,255,.68); border-radius:28px; box-shadow:var(--shadow); padding:24px 22px 24px;
      text-align:center; position:relative; overflow:hidden;
    }
    .badge{
      display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:999px; background:rgba(255,255,255,.72);
      color:#94617d; font-size:.9rem; font-weight:700; margin-bottom:10px;
    }
    .kitty{font-size:68px; line-height:1; margin:6px 0 10px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.12));}
    h1{font-size:1.8rem; line-height:1.18; margin:4px 0 12px; color:#814a69}
    .lead{font-size:1rem; line-height:1.6; color:var(--muted); margin:0 auto 16px; max-width:31ch}
    .bubble-wrap{
      background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,248,252,.95));
      border-radius:22px; padding:14px 14px 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 10px 22px rgba(156,99,146,.12);
      margin:16px 0 18px;
    }
    .bubble-title{font-size:.9rem; font-weight:800; color:#916980; margin-bottom:8px; letter-spacing:.2px}
    .message{
      min-height:112px; display:flex; align-items:center; justify-content:center;
      font-size:1.05rem; line-height:1.7; font-weight:600; color:#70465f; padding:4px 8px;
      transition:opacity .25s ease, transform .25s ease;
    }
    .message.fade{opacity:0; transform:translateY(6px)}
    .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
    button{
      border:none; border-radius:999px; padding:13px 18px; cursor:pointer; font-weight:800; font-size:.98rem;
      transition:transform .15s ease, box-shadow .2s ease, background .2s ease; box-shadow:0 10px 20px rgba(148,74,114,.18);
    }
    button:hover{transform:translateY(-2px)}
    .primary{background:linear-gradient(180deg,var(--btn2),var(--btn)); color:#fff}
    .secondary{background:#fff; color:#8b5275}
    .tiny{
      margin-top:14px; color:#8d6880; font-size:.92rem; line-height:1.55;
    }
    .hearts{display:flex; justify-content:center; gap:10px; margin-top:12px; font-size:1.18rem}
    .hearts span{animation:bob 2.5s ease-in-out infinite}
    .hearts span:nth-child(2){animation-delay:.3s}
    .hearts span:nth-child(3){animation-delay:.6s}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .footer-note{margin-top:10px; font-size:.82rem; color:#96798d}

    .sparkle{
      position:absolute; width:9px; height:9px; background:radial-gradient(circle,#fff7b8 0%, #fff1a8 55%, rgba(255,241,168,0) 72%);
      border-radius:50%; opacity:.8; animation:twinkle 2.8s ease-in-out infinite;
    }
    .s1{top:18px; left:22px} .s2{top:28px; right:32px; animation-delay:.7s}
    .s3{bottom:106px; right:26px; animation-delay:1.2s} .s4{bottom:160px; left:28px; animation-delay:1.6s}
    @keyframes twinkle{0%,100%{transform:scale(.7); opacity:.45}50%{transform:scale(1.2); opacity:1}}

    @media (max-width:420px){
      .card{padding:22px 18px 22px; border-radius:24px}
      h1{font-size:1.55rem}
      .lead{font-size:.96rem}
      .message{font-size:1rem; min-height:124px}
      button{width:100%}
      .row{gap:12px}
    }
  
    .kitty svg{animation:bob 4s ease-in-out infinite;overflow:visible}
    .motion{font-size:.8rem;box-shadow:none;background:transparent;color:#795b71;padding:8px; text-decoration:underline; width:auto}
    .paused *,.paused *::before,.paused *::after{animation-play-state:paused!important;transition:none!important}
    #hugBtn{touch-action:manipulation; position:relative;z-index:2;}
    .row{padding:8px 0;}
    @media(prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition:none!important}}
    </style>
</head>
<body>
  <div class="sky-glow"></div>
  <div class="stars" id="stars"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <main class="wrap">
    <section class="card">
      <span class="sparkle s1"></span>
      <span class="sparkle s2"></span>
      <span class="sparkle s3"></span>
      <span class="sparkle s4"></span>

      <div class="badge">✦ một chút bình yên</div>
      <div class="kitty" aria-hidden="true"><svg viewBox="0 0 160 125" width="115" height="90"><path d="M35 52 L33 13 Q33 6 41 11 L64 30 Q80 26 96 30 L119 11 Q127 6 127 13 L125 52 Q145 101 80 108 Q15 101 35 52Z" fill="#fff6ee" stroke="#b885a0" stroke-width="2.4"/><path d="M41 21 L43 43 L56 32 M119 21 L117 43 L104 32" fill="#e9a8c2"/><ellipse cx="47" cy="76" rx="11" ry="5" fill="#f1b2c8"/><ellipse cx="113" cy="76" rx="11" ry="5" fill="#f1b2c8"/><g class="eyes" stroke="#795268" stroke-width="3" stroke-linecap="round" fill="none"><path d="M52 63 Q59 55 66 63 M94 63 Q101 55 108 63 M73 74 Q80 81 87 74"/></g><path d="M80 88 L87 101 L102 103 L91 113 L94 125 L80 118 L66 125 L69 113 L58 103 L73 101Z" fill="#ffe3a0" stroke="#d5ab78" stroke-width="1.5"/></svg></div>
      <h1>Một chút nghỉ ngơi<br>cho hôm nay</h1>
      <p class="lead">Hôm nay mệt rồi thì nghỉ một chút nha. Ở đây có mèo và vài ngôi sao nhỏ :></p>

      <div class="bubble-wrap">
        <div class="bubble-title">một lời chúc nhỏ</div>
        <div class="message" id="messageBox">
          Chúc em có một buổi chiều nhẹ nhàng, ăn ngon và nghỉ ngơi thật đủ.
        </div>
      </div>

      <div class="row">
        <button class="primary" id="nextBtn">Mở lời chúc ✨</button>
        <button class="secondary" id="hugBtn">Bắt sao ⭐</button>
      </div>

      <div class="hearts" aria-hidden="true">
        <span>🌷</span><span>⭐</span><span>☁️</span>
      </div>

      <p class="tiny" id="tinyNote">
        Ngôi sao hơi nghịch, thử bắt xem nào =))
      </p>
      <div class="footer-note"><button id="motionBtn" class="motion" type="button" aria-pressed="false">Tạm dừng chuyển động</button></div>
    </section>
  </main>

  <script>
    const messages = [
      'Chúc em có một buổi chiều nhẹ nhàng, ăn ngon và nghỉ ngơi thật đủ.',
      'Nhớ uống nước và nghỉ mắt một chút nha.',
      'Mèo xin gửi một chiếc sao may mắn cho hôm nay ⭐',
      'Học hành cứ từ từ, sức khỏe vẫn quan trọng nhất.',
      'Chúc em sớm khỏe lại và tối nay ngủ thật ngon!'
    ];
    let index = 0, attempts = 0;
    const box = document.getElementById('messageBox');
    const tiny = document.getElementById('tinyNote');
    const nextBtn = document.getElementById('nextBtn');
    const starBtn = document.getElementById('hugBtn');
    const motionBtn = document.getElementById('motionBtn');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = reduced.matches;
    function syncMotion(){
      document.body.classList.toggle('paused',paused);
      motionBtn.setAttribute('aria-pressed',String(paused));
      motionBtn.textContent=paused?'Bật chuyển động':'Tạm dừng chuyển động';
      if(paused) starBtn.style.transform='';
    }
    syncMotion();
    motionBtn.addEventListener('click',()=>{paused=!paused;syncMotion();});
    nextBtn.addEventListener('click',()=>{
      index=(index+1)%messages.length;
      box.textContent=messages[index];
      nextBtn.textContent=index===messages.length-1?'Xem lại lời chúc ⭐':'Mở thêm lời chúc ✨';
    });
    function dodge(e){
      if(paused || attempts>=3) return;
      if(e.type==='pointerenter' && e.pointerType!=='mouse')return;
      if(e.type==='pointerdown' && e.pointerType==='mouse')return;
      if(e.cancelable && e.type==='pointerdown')e.preventDefault();
      attempts++;
      const maxX = Math.min(34,Math.max(0,(starBtn.parentElement.clientWidth-starBtn.offsetWidth)/2-4));
      starBtn.style.transform=`translate(${attempts%2?maxX:-maxX}px, ${attempts%2?-16:12}px)`;
      tiny.textContent=attempts===3?'Ngôi sao chịu thua rồi, bấm thử đi!':'Hí hí, ngôi sao chạy mất rồi!';
    }
    starBtn.addEventListener('pointerenter',dodge);
    starBtn.addEventListener('pointerdown',dodge);
    starBtn.addEventListener('click',()=>{
      attempts=0; starBtn.style.transform='';
      tiny.textContent='Bắt được sao rồi! Chúc hôm nay gặp nhiều chuyện vui ⭐';
      starBtn.textContent='Bắt lại ⭐';
      if(!paused)sprinkle();
    });

    function sprinkle(){
      for(let i=0;i<8;i++){
        const s = document.createElement('span');
        s.textContent = i % 2 === 0 ? '⭐' : '✨';
        s.style.position='fixed';
        s.style.left = (Math.random()*90+5)+'vw';
        s.style.top = (Math.random()*50+18)+'vh';
        s.style.fontSize = (Math.random()*8 + 12)+'px';
        s.style.pointerEvents='none';
        s.style.zIndex='5';
        s.style.opacity='0';
        s.style.transition='transform 1.2s ease, opacity 1.2s ease';
        document.body.appendChild(s);
        requestAnimationFrame(()=>{
          s.style.opacity='1';
          s.style.transform='translateY(-14px)';
        });
        setTimeout(()=>{
          s.style.opacity='0';
          s.style.transform='translateY(-30px)';
        },700);
        setTimeout(()=>s.remove(),1400);
      }
    }

    const stars = document.getElementById('stars');
    const smallStarCount = window.innerWidth < 500 ? 12 : 22;
    for(let i=0;i<smallStarCount;i++){
      const el = document.createElement('div');
      el.className = 'star';
      el.textContent = Math.random() > 0.35 ? '✦' : '★';
      el.style.left = Math.random()*100 + 'vw';
      el.style.fontSize = (Math.random()*8 + 8) + 'px';
      el.style.animationDuration = (Math.random()*13 + 18) + 's';
      el.style.animationDelay = (Math.random()*-20) + 's';
      el.style.opacity = Math.random()*0.4 + 0.35;
      stars.appendChild(el);
    }
  </script>
</body>
</html>
